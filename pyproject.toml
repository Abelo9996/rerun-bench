[project]
name = "rerun-bench"
version = "0.1.1"
description = "Run the same coding task N times per agent and measure how consistent and how expensive it is."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abel Yagubyan" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["benchmark", "coding-agents", "llm-evaluation", "reliability", "consistency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Abelo9996/rerun-bench"
Issues = "https://github.com/Abelo9996/rerun-bench/issues"

[project.scripts]
rerun-bench = "rerun_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rerun_bench"]

# The task suite lives at the repo root (tasks/) so it is easy to browse and
# contribute to, and is bundled into the wheel so `uvx rerun-bench` works.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "rerun_bench/_bundled_tasks"

[tool.hatch.build.targets.sdist]
include = ["src", "tasks", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tasks/*/workspace", "tasks/*/solution"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
