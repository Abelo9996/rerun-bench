name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Task suite self-check
        run: uv run rerun-bench verify-tasks
      - name: Mock benchmark smoke test
        shell: bash
        run: |
          uv run rerun-bench run --agent mock --tasks all --runs 3 --out smoke/ --quiet
          uv run rerun-bench report smoke/ --format md
          uv run rerun-bench report smoke/ --format html -o smoke/report.html
          uv run rerun-bench report smoke/ --format json -o smoke/report.json
          test -s smoke/report.html
      - name: Installed entry point
        shell: bash
        run: uvx --from . rerun-bench --help
