name: Bug report
description: Something in rerun-bench does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what you saw. Paste the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rerun-bench version
      placeholder: "rerun-bench --version"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent, model and CLI version (if relevant)
      placeholder: "claude sonnet, Claude Code 2.1.x"
  - type: input
    id: platform
    attributes:
      label: OS and Python version
